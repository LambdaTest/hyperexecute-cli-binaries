name: Mirror image to GitHub Container Registry

# Copies lambdatest/hyperexecute from Docker Hub to ghcr.io/lambdatest/hyperexecute.
# Runs daily so ghcr.io follows Docker Hub, and on demand.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [latest]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/ghcr
          build-args: SOURCE_IMAGE=docker.io/lambdatest/hyperexecute:${{ matrix.tag }}
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          tags: ghcr.io/lambdatest/hyperexecute:${{ matrix.tag }}
